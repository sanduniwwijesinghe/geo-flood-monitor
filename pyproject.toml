[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflood"
version = "0.1.0"
description = "Sentinel-2 flood-extent detection pipeline for Sri Lanka, built to run on AKS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanduni Wijesinghe" }]
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3.9",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "azure-storage-blob>=12.19",
  "azure-identity>=1.16",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
geoflood = "geoflood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoflood = ["aois.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
