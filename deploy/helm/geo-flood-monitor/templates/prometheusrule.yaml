{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $slo := .Values.monitoring.slo }}
{{- $ing := include "gfm.titiler.name" . }}
{{- $sel := printf "ingress=%q" $ing }}
{{- $latBudget := $slo.tileLatencyErrorBudget }}
{{- $availBudget := $slo.tileAvailabilityErrorBudget }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gfm.fullname" . }}-slo
  labels:
    {{- include "gfm.labels" . | nindent 4 }}
    {{- toYaml .Values.monitoring.prometheusRule.labels | nindent 4 }}
spec:
  groups:
    # ---------------------------------------------------------------- pipeline freshness
    - name: geoflood-pipeline
      rules:
        - record: geoflood:hours_since_success
          expr: (time() - geoflood_last_success_timestamp_seconds) / 3600
        - alert: GeofloodPipelineStale
          expr: geoflood:hours_since_success > {{ $slo.freshnessHours }}
          for: 10m
          labels: { severity: warning, slo: freshness }
          annotations:
            summary: {{ `"Flood analysis for {{ $labels.aoi }} is stale"` }}
            description: {{ printf "\"No successful run for {{ $value | humanize }}h (SLO: %vh).\"" $slo.freshnessHours }}
            runbook_url: https://github.com/sanduniwwijesinghe/geo-flood-monitor/blob/main/docs/runbook.md#pipeline-stale
        - alert: GeofloodPipelineFailing
          expr: geoflood_last_failure_timestamp_seconds > geoflood_last_success_timestamp_seconds
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: {{ `"Latest flood pipeline run for {{ $labels.aoi }} failed"` }}
            runbook_url: https://github.com/sanduniwwijesinghe/geo-flood-monitor/blob/main/docs/runbook.md#pipeline-failing
        - alert: GeofloodLowCoverage
          expr: geoflood_valid_pixel_ratio < 0.3
          for: 5m
          labels: { severity: info }
          annotations:
            summary: {{ `"Only {{ $value | humanizePercentage }} of {{ $labels.aoi }} was cloud-free"` }}

    # ---------------------------------------------------------------- tile SLIs
    - name: geoflood-tiles-sli
      rules:
        {{- range $w := list "5m" "30m" "1h" "6h" }}
        - record: geoflood:tile_latency_bad:ratio_rate{{ $w }}
          expr: |
            1 - (
              sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{ {{- $sel }},le="{{ $slo.tileLatencySeconds }}"}[{{ $w }}]))
              /
              sum(rate(nginx_ingress_controller_request_duration_seconds_count{ {{- $sel }}}[{{ $w }}]))
            )
        - record: geoflood:tile_errors:ratio_rate{{ $w }}
          expr: |
            sum(rate(nginx_ingress_controller_requests{ {{- $sel }},status=~"5.."}[{{ $w }}]))
            /
            sum(rate(nginx_ingress_controller_requests{ {{- $sel }}}[{{ $w }}]))
        {{- end }}

    # ---------------------------------------------------------------- multi-window, multi-burn-rate alerts
    # Google SRE workbook: page at 14.4x burn (2% of 30d budget in 1h),
    # ticket at 6x (5% of budget in 6h)
    - name: geoflood-tiles-slo
      rules:
        {{- range $s := list (dict "name" "Latency" "rec" "tile_latency_bad" "budget" $latBudget) (dict "name" "Availability" "rec" "tile_errors" "budget" $availBudget) }}
        - alert: GeofloodTile{{ $s.name }}BudgetBurnFast
          expr: |
            geoflood:{{ $s.rec }}:ratio_rate1h > (14.4 * {{ $s.budget }})
            and
            geoflood:{{ $s.rec }}:ratio_rate5m > (14.4 * {{ $s.budget }})
          for: 2m
          labels: { severity: critical, slo: tile-{{ lower $s.name }} }
          annotations:
            summary: "Tile {{ lower $s.name }} SLO burning error budget at >14.4x"
        - alert: GeofloodTile{{ $s.name }}BudgetBurnSlow
          expr: |
            geoflood:{{ $s.rec }}:ratio_rate6h > (6 * {{ $s.budget }})
            and
            geoflood:{{ $s.rec }}:ratio_rate30m > (6 * {{ $s.budget }})
          for: 15m
          labels: { severity: warning, slo: tile-{{ lower $s.name }} }
          annotations:
            summary: "Tile {{ lower $s.name }} SLO burning error budget at >6x"
        {{- end }}
{{- end }}
